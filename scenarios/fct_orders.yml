version: 1
name: test_fct_orders
model: model.consumer.fct_orders
inputs:
  input_1:
    node: model.consumer.stg_orders
    columns:
      order_id: bigint
      amount: numeric(12,2)
      adjustment: numeric(12,2)
      customer: text
      updated_at: timestamp
output:
  columns:
    order_id: bigint
    amount: numeric(12,2)
    customer: text
    updated_at: timestamp
  primary_key:
  - order_id
steps:
- name: initial
  inputs:
    input_1:
      replace:
        rows:
        - order_id: 1
          amount: '10.00'
          adjustment: '1.00'
          customer: pilot.fixture.private@example.invalid
          updated_at: '2026-11-08T00:00:00'
  run:
    mode: initial
  expect:
    rows:
    - order_id: 1
      amount: '11.00'
      customer: pilot.fixture.private@example.invalid
      updated_at: '2026-11-08T00:00:00'
- name: incremental
  inputs:
    input_1:
      replace:
        rows:
        - order_id: 1
          amount: '12.00'
          adjustment: '2.00'
          customer: pilot.fixture.private@example.invalid
          updated_at: '2026-11-08T01:00:00'
        - order_id: 2
          amount: '20.00'
          adjustment: '0.50'
          customer: pilot.fixture.private@example.invalid
          updated_at: '2026-11-08T01:00:00'
  run:
    mode: incremental
  expect:
    rows:
    - order_id: 1
      amount: '14.00'
      customer: pilot.fixture.private@example.invalid
      updated_at: '2026-11-08T01:00:00'
    - order_id: 2
      amount: '20.50'
      customer: pilot.fixture.private@example.invalid
      updated_at: '2026-11-08T01:00:00'
- name: retry
  run:
    mode: incremental
  expect:
    same_as: incremental
