name: External model checks
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/historical.yml
      - historical/**
      - scripts/reproduce_history.py
      - scripts/compare_approaches.py
      - scripts/check_watermarks.py
      - investigations/watermark-boundary/**
      - src/**
      - requirements-dev.lock.txt
permissions:
  contents: read
jobs:
  reproduction:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: mit-empty-watermark
            script: reproduce_history.py
            artifact: historical-mit-empty-watermark
          - case: watermark-boundary
            script: check_watermarks.py
            artifact: watermark-boundary
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dbt_scenario_test
          POSTGRES_PASSWORD: disposable-admin-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbt_scenario_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DSC_TEST_PASSWORD: disposable-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python -m pip install --no-deps -e .
      - name: Create restricted test role
        env:
          PGHOST: 127.0.0.1
          PGPORT: 55432
          PGUSER: postgres
          PGPASSWORD: disposable-admin-password
          POSTGRES_USER: postgres
          POSTGRES_DB: dbt_scenario_test
        run: bash scripts/init-test-db.sh
      - name: Download and verify immutable upstream sources
        run: python scripts/${{ matrix.script }} --fetch-only --sources-dir artifacts/upstream-sources
      - name: Execute model checks and verify expected outcomes
        run: python scripts/${{ matrix.script }} --config scenario-runner.yml --sources-dir artifacts/upstream-sources --output artifacts/results/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/results/result.json
