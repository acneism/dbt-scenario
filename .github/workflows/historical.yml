name: Historical regression
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/historical.yml
      - historical/**
      - scripts/reproduce_history.py
      - scripts/compare_approaches.py
      - src/**
      - requirements-dev.lock.txt
permissions:
  contents: read
jobs:
  mit-empty-watermark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dbt_scenario_test
          POSTGRES_PASSWORD: disposable-admin-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbt_scenario_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DSC_TEST_PASSWORD: disposable-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python -m pip install --no-deps -e .
      - name: Create restricted test role
        env:
          PGHOST: 127.0.0.1
          PGPORT: 55432
          PGUSER: postgres
          PGPASSWORD: disposable-admin-password
          POSTGRES_USER: postgres
          POSTGRES_DB: dbt_scenario_test
        run: bash scripts/init-test-db.sh
      - name: Download and verify immutable upstream sources
        run: python scripts/reproduce_history.py --fetch-only --sources-dir artifacts/historical-sources
      - name: Reproduce both revisions and compare native dbt tests
        run: python scripts/reproduce_history.py --config scenario-runner.yml --sources-dir artifacts/historical-sources --output artifacts/historical/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-mit-empty-watermark
          path: artifacts/historical/result.json
