name: Consumer scenario gate
on:
  push:
  workflow_dispatch:
    inputs:
      scenario-dir:
        type: string
        default: scenarios/pass
        description: Controlled pass, fail or empty scenario directory
permissions:
  contents: read
jobs:
  scenarios:
    uses: acneism/dbt-scenario/.github/workflows/scenarios.yml@c862ff3fb2ca2e91b020314addc56a42795af3b4
    with:
      project-dir: .
      scenario-dir: ${{ inputs.scenario-dir || 'scenarios/pass' }}
      config-file: scenario-runner.yml
      install-deps: true
