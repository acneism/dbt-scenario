name: Offline exit status proof
on:
  push:
    branches: [validation/offline-exit-status-2026-11-04]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  failure-propagation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Exercise the exact pipeline with both runner shell configurations
        shell: bash
        run: |
          mkdir -p artifacts/before/.github/workflows
          git show ff116a681f380428eddf71a07c3f222892247134:.github/workflows/ci.yml > artifacts/before/.github/workflows/ci.yml
          python scripts/check_offline_exit_status.py --repo artifacts/before --bash /bin/bash --output artifacts/exit-status --phase before
          python scripts/check_offline_exit_status.py --repo . --bash /bin/bash --output artifacts/exit-status --phase after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-exit-status-proof
          path: artifacts/exit-status/
