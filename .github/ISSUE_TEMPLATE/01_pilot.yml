name: Pilot interest or trial report
description: Try one real model, report a blocker, or update a trial's results.
title: "[Pilot] "
body:
  - type: markdown
    attributes:
      value: |
        Start with the [trial guide](https://github.com/acneism/dbt-scenario/blob/main/docs/PILOT.md). You can open this before running anything and update the same issue later.
        This issue is public. Use synthetic examples and anonymized project context; omit credentials, production rows and raw dbt logs. A repository URL or contact details are not required.
        Leave measurements blank when they have not been observed.
  - type: dropdown
    id: stage
    attributes:
      label: Trial stage
      options:
        - Interested, not started
        - First scenario attempted
        - Connected to CI
        - Second scenario attempted
        - Four-week follow-up
        - Stopped the trial
    validations:
      required: true
  - type: textarea
    id: project
    attributes:
      label: Project and model
      description: An anonymous alias is enough. Include the warehouse, incremental strategy, direct inputs and relevant column types if known.
      placeholder: A private PostgreSQL project; one delete+insert model with two inputs.
    validations:
      required: true
  - type: textarea
    id: concern
    attributes:
      label: Behavior to check
      description: Describe the intended table state after an update, delayed event, empty start or retry. Say whether this is a known regression, an injected defect or a concern to investigate.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions and execution environment
      description: If attempted, include dbt-scenario, Python, PostgreSQL, dbt Core, dbt-postgres and OS or CI runner.
      placeholder: dbt-scenario 0.1.0a13; Python 3.12; PostgreSQL 16; dbt Core 1.11; dbt-postgres 1.10; Linux CI
  - type: textarea
    id: result
    attributes:
      label: Result or blocker
      description: What ran, what happened and what help was needed? Include safe reason codes. An unsupported model or an abandoned attempt is useful feedback too.
  - type: textarea
    id: effort
    attributes:
      label: Setup and comparison effort
      description: Record human minutes for the first scenario, project edits and assistance. If an equivalent existing check was tried, record its setup effort and what it detected. Machine runtime is separate.
  - type: textarea
    id: second_scenario
    attributes:
      label: Second scenario
      description: Was it added without the tool author's assistance? Record minutes, help and difficulties. Leave blank if not attempted.
  - type: textarea
    id: retention
    attributes:
      label: CI use over time
      description: Record start and follow-up dates, weeks observed, meaningful runs on project changes, and whether the tests were kept, removed or the trial stopped. Include the reason. A two-week update is an intermediate checkpoint.
